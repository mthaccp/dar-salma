<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dar Salma</title>
<meta name="theme-color" content="#1e2f62">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dar Salma">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app shell — header + tab bar (bottom on phone, top on desktop), one panel per tab, sheet for forms */
:root{
  --bg:#f6f5f1; --surface:#ffffff; --sunk:#ecebe5; --line:#dcdad2;
  --fg:#1b2240; --muted:#5f6680; --accent:#1e2f62; --accent-soft:#e3e7f2; --on-accent:#ffffff;
  --jasmin:#a8823d; --jasmin-soft:#f4ecdc;
  --navy:#1e2f62; --gold:#c9a55f; --on-navy:#f3efe6;
  --c1:#3556b0; --c2:#c38a26;
  --k-rem:#a8761a; --k-pay:#2f56b0; --k-arr:#2f7a4f; --k-tom:#16767a; --k-out:#7a4fb0; --k-clean:#c0621a; --k-due:#b03a3a;
  --ok:#2f7a4f; --ok-soft:#dcefe3; --warn:#a8641a; --warn-soft:#f7e6d1; --bad:#b03a3a; --bad-soft:#f6dddd;
  --display:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --brand:"Cinzel", "Trajan Pro", Georgia, serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111529; --surface:#192037; --sunk:#222a44; --line:#2e3857;
  --fg:#e9ebf2; --muted:#9ba2b8; --accent:#a3b6ea; --accent-soft:#25325a; --on-accent:#111a33;
  --jasmin:#d8b46c; --jasmin-soft:#3a3020; --navy:#17244d; --c1:#6f8fe0; --c2:#b98a30; --k-rem:#e0b360; --k-pay:#7ea2ee; --k-arr:#6cc495; --k-tom:#5cc8c8; --k-out:#b493e8; --k-clean:#f0a060; --k-due:#ec8383;
  --ok:#6cc495; --ok-soft:#1d3329; --warn:#e3a35c; --warn-soft:#3a2b1b; --bad:#ec8383; --bad-soft:#3d2224;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111529; --surface:#192037; --sunk:#222a44; --line:#2e3857;
  --fg:#e9ebf2; --muted:#9ba2b8; --accent:#a3b6ea; --accent-soft:#25325a; --on-accent:#111a33;
  --jasmin:#d8b46c; --jasmin-soft:#3a3020; --navy:#17244d; --c1:#6f8fe0; --c2:#b98a30; --k-rem:#e0b360; --k-pay:#7ea2ee; --k-arr:#6cc495; --k-tom:#5cc8c8; --k-out:#b493e8; --k-clean:#f0a060; --k-due:#ec8383;
  --ok:#6cc495; --ok-soft:#1d3329; --warn:#e3a35c; --warn-soft:#3a2b1b; --bad:#ec8383; --bad-soft:#3d2224;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:clip}
nav.tabs .ic{display:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs .ls{display:none}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);border-bottom:2px solid var(--gold)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand img{width:46px;height:46px;border-radius:10px;display:block}
.brand .bt{display:grid;line-height:1.1}
.brand h1{font-family:var(--brand);font-weight:600;font-size:1.25rem;margin:0;letter-spacing:.08em;color:var(--on-navy)}
.brand .arch{width:22px;height:26px;border:2.5px solid var(--accent);border-bottom:none;border-radius:11px 11px 0 0;align-self:center}
.brand small{color:var(--gold);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
nav.tabs{display:flex;gap:4px}
nav.tabs button{background:none;border:none;padding:8px 12px;border-radius:999px;color:rgba(243,239,230,.72);font-weight:600;cursor:pointer}
nav.tabs button[aria-current="page"]{background:rgba(201,165,95,.2);color:var(--gold)}
nav.tabs button:focus-visible,.btn:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px calc(110px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
.panel>*{min-width:0}
.panel{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
h2{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.stat b{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.15;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:none}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.item.click{cursor:pointer}
.item.click:hover{background:var(--sunk)}
.empty{padding:18px 14px;color:var(--muted);font-size:.9rem}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.ex{background:var(--jasmin-soft);color:var(--jasmin)}
.pen{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.edit{display:inline-flex;align-items:center;gap:5px}
.cal th.room button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.cal th.room button:hover{color:var(--accent);text-decoration:underline}
.cal th.room button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cal th.room .pen{opacity:.45}
.roomtag{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.85rem}
/* calendar */
.cal{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.cal table{border-collapse:collapse;min-width:720px;width:100%;table-layout:fixed}
.cal thead th.room{width:150px}
.cal th,.cal td{border-left:1px solid var(--line);border-top:1px solid var(--line);padding:0;text-align:center;font-size:.78rem}
.cal thead th{border-top:none;padding:6px 2px;color:var(--muted);font-weight:600}
.cal thead th.today{color:var(--accent)}
.cal thead th .d{display:block;font-size:1rem;color:var(--fg);font-weight:700}
.cal thead th.today .d{color:var(--accent)}
.cal thead th.we{background:var(--sunk)}
.cal th.room{border-left:none;text-align:left;padding:8px 10px;white-space:nowrap;position:sticky;left:0;background:var(--surface);z-index:1;font-size:.85rem;color:var(--fg)}
.cell{width:100%;height:42px;border:none;background:none;cursor:pointer;padding:0}
.cell:hover{background:var(--sunk)}
.blk{display:block;height:42px;background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,transparent 6px 12px);cursor:not-allowed}
.cal tr.house th.room{color:var(--accent);font-weight:800}
.cal tr.house td,.cal tr.house th{border-bottom:2px solid var(--line)}
.bk{display:block;height:30px;margin:0 -1px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:.72rem;line-height:30px;overflow:hidden;white-space:nowrap;text-align:left;padding-left:6px;cursor:pointer;border:none;width:calc(100% + 2px)}
.bk.opt{opacity:.6;outline:2px dashed var(--fg);outline-offset:-2px}
.bk.unpaid{background:var(--jasmin);color:var(--surface)}
.bk.start{border-radius:6px 0 0 6px;margin-left:3px;width:calc(100% - 2px)}
.bk.end{border-radius:0 6px 6px 0;margin-right:3px}
.bk.start.end{border-radius:6px;width:calc(100% - 6px)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
/* forms / sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:16px}}
form.f{display:grid;gap:12px}
.f label{display:grid;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-weight:400;color:var(--fg);width:100%;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:.85rem;padding:9px 12px;border-radius:8px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--accent-soft);color:var(--accent)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.summary{background:var(--sunk);border-radius:8px;padding:10px 12px;display:grid;gap:4px;font-size:.9rem}
.summary div{display:flex;justify-content:space-between;gap:10px}
.summary .big{font-weight:700;font-size:1rem}
.pay{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;padding:6px 0;border-top:1px dashed var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;z-index:60;font-size:.9rem}
.banner{background:var(--jasmin-soft);color:var(--fg);border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.banner .grow{flex:1;min-width:200px}
.search{flex:1;min-width:180px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.seg{display:flex;width:max-content;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:var(--sunk);border-radius:999px;padding:3px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;white-space:nowrap;border:none;background:none;padding:5px 12px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer;font-size:.85rem}
.seg button.on{background:var(--surface);color:var(--fg)}
@media (max-width:760px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  nav.tabs button{padding:6px 1px;font-size:.64rem;flex:1 1 0;min-width:0;color:var(--muted);display:grid;justify-items:center;gap:2px;border-radius:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav.tabs .ic{display:block}
  nav.tabs .ll{display:none}
  nav.tabs .ls{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .top-in{flex-wrap:nowrap;gap:10px}
  .brand{min-width:0;flex:1 1 auto;gap:10px}
  .brand img{width:40px;height:40px;flex:none}
  .brand .bt{min-width:0}
  .brand h1{font-size:1.05rem;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sheet .edit .el{display:none}
  .sheet .btn.edit{padding:8px;border-radius:50%}
  header .out{padding:8px;border-radius:50%}
  header .out .lo{display:block}
  header .out .lot{display:none}
  main .row.spread h2{min-width:0;flex:1 1 auto}
  nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .g2{grid-template-columns:1fr 1fr}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0;align-content:start}
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}.chart .ax{stroke:var(--muted);stroke-width:1}
.chart .tk{fill:var(--muted);font-size:11px;font-family:var(--body)}.chart .tk.cur{fill:var(--fg);font-weight:700}
.chart .hit{fill:transparent;cursor:pointer}.chart .hit:hover{fill:var(--sunk);opacity:.5}
.hbars{display:grid;gap:8px}
.hb{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;gap:10px;align-items:center;font-size:.88rem;cursor:default}
.hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ht{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.hf{display:block;height:100%;border-radius:0 6px 6px 0}
.hv{color:var(--muted);font-size:.82rem;white-space:nowrap}
.hero{background:var(--navy);color:var(--on-navy);border-radius:var(--r);padding:18px 20px;display:flex;gap:16px 28px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;border-bottom:3px solid var(--gold)}
.hero span{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--gold);font-weight:700}
.hero b{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1.1;letter-spacing:-.02em}
.hero small{display:block;color:rgba(243,239,230,.7);font-size:.78rem;margin-top:4px}
.hero-side{display:flex;gap:22px;flex-wrap:wrap}.hero-side b{font-size:1.3rem}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.88rem}
.tbl{overflow-x:auto;margin-top:8px}.tbl table{border-collapse:collapse;width:100%;font-size:.85rem;min-width:520px}
.tbl th,.tbl td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--muted);font-weight:600}
.step{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.step .pp{width:20px;height:20px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;margin-left:2px}
.step .sb{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-size:1.15rem;font-weight:700;line-height:1;cursor:pointer;flex:none;padding:0}
.step .sb:active{background:var(--accent-soft)}
.f .step input{border:none;background:transparent;text-align:center;font-weight:700;font-size:1rem;padding:6px 0;min-width:0;width:100%;-moz-appearance:textfield}
.f .step input::-webkit-outer-spin-button,.f .step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.f .step input:focus{outline:none}
.step:focus-within{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.remind{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--jasmin);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.remind .rh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.remind .rh svg{width:20px;height:20px;fill:none;stroke:var(--jasmin);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.remind .list{border:none}
nav.tabs button{position:relative}
nav.tabs button[data-badge]:not([data-badge=""])::after{content:attr(data-badge);position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:800;line-height:18px;text-align:center}
.exadd{display:grid;grid-template-columns:1fr 64px 92px;gap:8px;margin-top:8px}
.exadd #x_other{grid-column:1/-1}.exadd #x_add{grid-column:1/-1;justify-self:start}
.exadd select,.exadd input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%;color:var(--fg)}
.catrow{display:grid;grid-template-columns:1.4fr 90px 1fr auto;gap:6px;align-items:center}
.catrow input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 9px;min-width:0;width:100%;color:var(--fg)}
@media (max-width:520px){.catrow{grid-template-columns:1fr 80px auto}.catrow [data-k="unit"]{grid-column:1/3;grid-row:2}}
.btn.wa{background:#1f8a4c;border-color:#1f8a4c;color:#fff;display:inline-flex;align-items:center;gap:6px}
.btn.wa svg{width:16px;height:16px;fill:currentColor}
.phone{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:8px}
.f .phone select,.f .phone input{min-width:0}
.pillbtn{display:inline-flex;align-items:center;gap:3px;padding:4px 8px 4px 11px;border-radius:999px;font-size:.8rem;font-weight:700;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.pillbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pillbtn.ok{background:var(--ok-soft);color:var(--ok)}.pillbtn.bad{background:var(--bad-soft);color:var(--bad)}
.pillbtn:hover{border-color:currentColor}
.f label .btn{color:var(--fg)}
.sec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sc);border-radius:var(--r);overflow:hidden;min-width:0}
.sec>.sh{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--sunk);background:color-mix(in srgb,var(--sc) 10%,var(--surface));border-bottom:1px solid var(--line);flex-wrap:wrap}
.sec>.sh h3{margin:0;color:var(--sc);flex:1 1 auto;min-width:0}
@media (min-width:761px){.sec>.sh{flex-wrap:nowrap}.sec>.sh .btn{white-space:nowrap}}
.sec>.sh .sp{display:none}
.sec>.sh>svg{width:19px;height:19px;fill:none;stroke:var(--sc);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sec .cnt{background:var(--sc);color:var(--surface);border-radius:999px;font-size:.72rem;font-weight:800;padding:1px 8px;line-height:1.5}
.sec .sp{flex:1}
.sec>.list{border:none;border-radius:0}
.sec .btn.ghost{color:var(--sc)}

function roomState(r){ if(r.status==="reparation") return "reparation"; if(guestInside(r)) return "occupee"; const ld=lastDeparture(r), since=new Date(r.cleanedAt||AUTO_SINCE); if(ld && ld>since) return "a_nettoyer"; return r.status==="a_nettoyer" ? "a_nettoyer" : "propre"; }
const isHouse = id => { const r=room(id); return !!(r&&r.wholeHouse); };
const units = () => S.rooms.filter(r=>!r.wholeHouse);
const effOut = b => { if(!b.departedAt) return b.checkOut; const d=toISO(new Date(b.departedAt)); return d<b.checkIn ? b.checkIn : (d<b.checkOut ? d : b.checkOut); };
const overlaps = (x, rid, ci, co) => x.checkIn<co && ci<effOut(x) && (x.roomId===rid || isHouse(x.roomId) || isHouse(rid));
const conflicts = (rid, ci, co, exceptId) => activeBookings().filter(x=>x.id!==exceptId && overlaps(x,rid,ci,co));
const weight = b => isHouse(b.roomId) ? Math.max(1,units().length) : 1;
const occupying = (roomId, day) => activeBookings().find(b=>(b.roomId===roomId || (isHouse(b.roomId) && !isHouse(roomId))) && b.checkIn<=day && day<effOut(b));
const hasExamples = () => [...S.rooms,...S.clients,...S.bookings,...S.expenses].some(x=>x.example);

// ---------- db ----------
async function save(col, id, data){
  if(!S.db){ toast("Enregistrement impossible : base non connectée"); return false; }
  try{ await S.db.collection(col).doc(id).set(data); return true; }
  catch(e){
    if(e && e.code==="permission-denied"){ toast("Ce compte n'a pas le droit de modifier"); }
    else if(e && e.code==="quota_exceeded"){ toast("Espace plein : supprimez d'anciennes données"); }
    else toast("Erreur d'enregistrement, réessayez");
    return false;
  }
}
async function remove(col, id){ if(!S.db) return false; try{ await S.db.collection(col).doc(id).delete(); return true; }catch(e){ toast("Suppression impossible"); return false; } }
const strip = o => { const c={...o}; delete c.id; return c; };

let unsubs = [];
function syncLabel(){
  const el = $("#sync"); if(!S.db) return;
  const c = Object.values(S.cached||{}), p = Object.values(S.pending||{});
  if(!navigator.onLine) el.textContent = "Hors ligne · enregistré sur l'appareil";
  else if(p.some(Boolean)) el.textContent = "Envoi en cours…";
  else if(c.length && !c.some(Boolean)) el.textContent = "Synchronisé";
  else el.textContent = "Connexion…";
}
window.addEventListener("online", ()=>syncLabel()); window.addEventListener("offline", ()=>syncLabel());
function sub(col, sortFn){
  unsubs.push(S.db.collection(col).onSnapshot({includeMetadataChanges:true}, snap=>{
    S[col] = snap.docs.map(d=>({id:d.id, ...d.data()})).sort(sortFn||(()=>0));
    S.loaded[col]=true; S.cached = S.cached||{}; S.cached[col] = snap.metadata.fromCache; S.pending = S.pending||{}; S.pending[col] = snap.metadata.hasPendingWrites; syncLabel();
    if(col==="rooms" && snap.empty && !snap.metadata.fromCache && !S.seeded) seedRooms();
    if(col==="rooms" && !snap.empty && !snap.metadata.fromCache && !S.priceMigrated && S.canWrite){ S.priceMigrated=true;
      snap.docs.forEach(d=>{ const r=d.data(); if(!r.wholeHouse && !r.priceMode && (r.price===150 || r.price===220 || r.price===120 || r.price===180)) S.db.collection("rooms").doc(d.id).update({price:90, priceMode:"personne"}).catch(()=>{}); }); }
    if(false){}
    else if(col==="rooms" && !snap.empty && !snap.metadata.fromCache && !snap.docs.some(d=>d.data().wholeHouse) && !S.houseSeeded){ S.houseSeeded=true; const h={id:"maison", name:"Maison entière", short:"M", price:1000, capacity:15, wholeHouse:true, babyBed:true, status:"propre", note:"Toutes les chambres et le studio", order:0}; save("rooms",h.id,strip(h)); }
    render();
  }, err=>{
    const denied = err && err.code==="permission-denied";
    $("#sync").textContent = denied ? "Accès refusé" : "Hors connexion";
    if(denied){ const em=(firebase.auth().currentUser||{}).email||""; $("#main").innerHTML='<div class="banner"><span class="grow">Le compte <b>'+esc(em)+'</b> n\'a pas accès aux données de Dar Salma. Il doit figurer dans les règles Firestore. Déconnectez-vous et reconnectez-vous avec le bon nom d\'utilisateur.</span></div>'; }
  }));
}
async function seedRooms(){
  S.seeded = true;
  const rooms = [1,2,3,4,5,6].map(n=>({id:"r"+n, name:"Chambre "+n, short:String(n), price:90, priceMode:"personne", capacity:2, beds:"double", babyBed:true, status:"propre", note:"", order:n}));
  rooms.push({id:"maison", name:"Maison entière", short:"M", price:1000, capacity:15, wholeHouse:true, babyBed:true, status:"propre", note:"Toutes les chambres et le studio", order:0});
  rooms.push({id:"r7", name:"Studio indépendant", short:"S", price:90, priceMode:"personne", capacity:3, beds:"double", babyBed:true, status:"propre", note:"", order:7});
  for(const r of rooms) await save("rooms", r.id, strip(r));

function stopSubs(){ unsubs.forEach(u=>{try{u()}catch(e){}}); unsubs=[]; }

async function boot(){
  render();
  const cfg = window.FIREBASE_CONFIG;
  if(!window.firebase || !cfg || !cfg.apiKey || String(cfg.apiKey).indexOf("A_REMPLIR")===0){
    $("#sync").textContent="À configurer";
    $("#main").innerHTML='<div class="banner"><span class="grow">L\'application n\'est pas encore reliée à sa base de données. Remplissez le fichier firebase-config.js (voir le guide d\'installation).</span></div>';
    return;
  }
  firebase.initializeApp(cfg);
  const db = firebase.firestore();
  try{ await db.enablePersistence({synchronizeTabs:true}); }catch(e){}
  const auth = firebase.auth();
  const toEmail = v => { v = v.trim().toLowerCase(); return v.includes("@") ? v : v + "@darsalma.local"; };
  const lerr = m => { $("#l_err").innerHTML = m ? '<div class="note bad">'+m+'</div>' : ''; };
  $("#lf").addEventListener("submit", async e=>{
    e.preventDefault(); lerr(""); $("#l_go").disabled=true;
    try{ await auth.signInWithEmailAndPassword(toEmail($("#l_email").value), $("#l_pass").value); }
    catch(x){
      const c = x && x.code;
      lerr(["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-login-credentials","auth/invalid-email"].includes(c) ? "Nom d'utilisateur ou mot de passe incorrect."
        : c==="auth/too-many-requests" ? "Trop d'essais. Réessayez dans quelques minutes."
        : c==="auth/network-request-failed" ? "Pas de connexion internet."
        : "Connexion impossible. Vérifiez vos informations.");
    }
    $("#l_go").disabled=false;
  });
  $("#logout").addEventListener("click", ()=>auth.signOut());
  auth.onAuthStateChanged(u=>{
    if(u){
      $("#login").hidden=true; $("#logout").hidden=false; $("#logout").title = (u.email||"").replace("@darsalma.local","");
      if(!S.db){ S.db=db; $("#sync").textContent="Connexion…";
        sub("rooms",(a,b)=>(a.order??0)-(b.order??0));
        sub("clients",(a,b)=>String(a.name).localeCompare(String(b.name),"fr"));
        sub("bookings",(a,b)=>String(a.checkIn).localeCompare(String(b.checkIn)));
        sub("expenses",(a,b)=>String(b.date).localeCompare(String(a.date)));
        unsubs.push(db.collection("settings").doc("general").onSnapshot(d=>{ S.settings = Object.assign(JSON.parse(JSON.stringify(DEF_SET)), d.exists ? d.data() : {}); render(); }, ()=>{}));
      }
    } else {
      stopSubs(); S.db=null; S.rooms=[]; S.clients=[]; S.bookings=[]; S.expenses=[]; S.loaded={};
      closeSheet(); $("#logout").hidden=true; $("#login").hidden=false; $("#sync").textContent="Non connecté"; render();
    }
  });
}

async function markStay(id, field, val){
  const b=S.bookings.find(x=>x.id===id); if(!b||!S.db) return false;
  const data={[field]: val}; if(field==="departedAt" && val && !b.arrivedAt) data.arrivedAt=val;
  try{ await S.db.collection("bookings").doc(id).update(data); return true; }catch(e){ toast(e&&e.code==="permission-denied"?"Ce compte n'a pas le droit de modifier":"Enregistrement impossible, réessayez"); return false; }
}
function sec(k, icon, title, count, right, body){
  const m = /^<div class="empty">([\s\S]*)<\/div>$/.exec(body||"");
  if(m) return '<section class="sec slim" style="--sc:var(--k-'+k+')"><div class="sh"><svg viewBox="0 0 24 24" aria-hidden="true">'+SEC_ICONS[icon]+'</svg><h3>'+title+'</h3><span class="emp">'+m[1]+'</span>'+(right||'')+'</div></section>';
  return '<section class="sec" style="--sc:var(--k-'+k+')"><div class="sh"><svg viewBox="0 0 24 24" aria-hidden="true">'+SEC_ICONS[icon]+'</svg><h3>'+title+'</h3>'+(count>0?'<span class="cnt">'+count+'</span>':'')+'<span class="sp"></span>'+(right||'')+'</div><div class="'+(count<0?'tiles':'list')+'">'+body+'</div></section>';
}

function vCal(){
  const mob = window.innerWidth < 760, days = mob ? 7 : 14, start = S.calStart, t = today();
  const ds = Array.from({length:days},(_,i)=>addDays(start,i));
  const sd = parse(start), ed = parse(ds[days-1]);
  let h = '<div class="row spread"><h2>'+MOIS[sd.getMonth()].replace(/^./,c=>c.toUpperCase())+(sd.getMonth()!==ed.getMonth()?' – '+MOIS[ed.getMonth()]:'')+' '+ed.getFullYear()+'</h2><div class="row"><button class="btn sm" data-act="cal-prev" aria-label="Semaine précédente">←</button><button class="btn sm" data-act="cal-today">Aujourd\'hui</button><button class="btn sm" data-act="cal-next" aria-label="Semaine suivante">→</button></div></div>';
  h += '<div class="cal"><table'+(mob?' class="m"':'')+'><thead><tr><th class="room">'+(mob?'':'Chambre')+'</th>'+ds.map(d=>{const x=parse(d),we=x.getDay()===0||x.getDay()===6;return '<th class="'+(d===t?'today ':'')+(we?'we':'')+'">'+JOURS[x.getDay()]+'<span class="d">'+x.getDate()+'</span></th>';}).join("")+'</tr></thead><tbody>';
  S.rooms.forEach(r=>{
    h += '<tr'+(r.wholeHouse?' class="house"':'')+'><th class="room">'+(S.canWrite?'<button data-act="edit-room" data-id="'+r.id+'" title="Modifier '+esc(r.name)+'">'+esc(mob?(r.short||r.name):r.name)+'<svg class="pen" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg></button>':esc(mob?(r.short||r.name):r.name))+'</th>';
    ds.forEach(d=>{
      const b = occupying(r.id,d);
      const blocked = !b && (r.wholeHouse ? units().some(u=>occupying(u.id,d)) : false);
      if(blocked){ h += '<td><span class="blk" data-tip="Maison entière indisponible : au moins une chambre est réservée le '+fmtD(d)+'"></span></td>'; }
      else if(b){
        const isStart = b.checkIn===d || d===start, isEnd = addDays(d,1)===b.checkOut;
        const c = client(b.clientId);
        const label = (b.checkIn===d||d===start)?esc(c?c.name.split(" ")[0]:"?"):"";
        h += '<td><button class="bk '+(isOption(b)?'opt ':'')+(balance(b)>0?'unpaid ':'')+(isStart?'start ':'')+(isEnd?'end':'')+'" data-act="edit-booking" data-id="'+b.id+'" title="'+esc(c?c.name:"")+'">'+label+'</button></td>';
      } else h += '<td><button class="cell" data-act="new-booking" data-room="'+r.id+'" data-day="'+d+'" aria-label="Réserver '+esc(r.name)+' le '+fmtD(d)+'"'+(S.canWrite?'':' disabled')+'></button></td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  h += '<div class="legend"><span><i style="background:var(--accent)"></i>Payé</span><span><i style="background:var(--jasmin)"></i>Solde à encaisser</span><span><i style="background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 6px)"></i>Maison entière indisponible</span><span>Touchez une case vide pour réserver.</span></div>';
  if(!S.rooms.length) h += '<div class="empty">Ajoutez vos chambres dans Finances › Chambres pour voir le calendrier.</div>';
  return h;
}

function vResa(){
  const t = today(), f = S.resaFilter;
  let list = S.bookings.slice();
  const rq=(S.resaQ||"").trim().toLowerCase();
  if(rq) list = list.filter(b=>{ const c=client(b.clientId)||{}, r=room(b.roomId)||{}; return [c.name,c.phone,r.name,b.notes].join(" ").toLowerCase().includes(rq); });
  if(f==="avenir") list = list.filter(b=>b.status!=="annulee" && b.checkOut>=t);
  else if(f==="options") list = list.filter(isOption);
  else if(f==="passees") list = list.filter(b=>b.status!=="annulee" && b.checkOut<t).reverse();
  else if(f==="impayees") list = list.filter(b=>b.status!=="annulee" && balance(b)>0);
  else if(f==="annulees") list = list.filter(b=>b.status==="annulee");
  const seg = [["avenir","À venir"],["impayees","Impayées"],["passees","Passées"],["annulees","Annulées"]];
  let h = '<div class="row spread"><h2>Réservations</h2><div class="row"><button class="btn sm" data-act="ics-upcoming"><span class="hm">Rappels dans le calendrier</span><span class="sm-only">Rappels</span></button><button class="btn primary hm" data-act="new-booking"'+(S.canWrite?'':' disabled')+'>+ Réservation</button></div></div>';
  h += '<input class="search" id="resaQ" type="search" placeholder="Rechercher un client, un téléphone…" value="'+esc(S.resaQ||"")+'">';
  h += '<div class="seg" role="tablist">'+seg.map(([k,l])=>'<button class="'+(k===f?'on':'')+'" data-act="resa-filter" data-f="'+k+'">'+l+'</button>').join("")+'</div>';

function vPolice(){
  const t=today(), f=S.polFilter||"todo", q=(S.polQ||"").trim().toLowerCase();
  let list = activeBookings().slice();
  if(q) list = list.filter(b=>{ const c=client(b.clientId)||{}; return [c.name,c.phone,(b.travelers||[]).map(x=>x.nom+" "+x.prenom+" "+x.pieceNum).join(" ")].join(" ").toLowerCase().includes(q); });
  const todoAll = activeBookings().filter(b=>!policeReady(b) && b.checkOut>=addDays(t,-30));
  if(f==="todo") list = list.filter(b=>!policeReady(b) && b.checkOut>=addDays(t,-30)).sort((a,b)=>a.checkIn.localeCompare(b.checkIn));
  else if(f==="today") list = list.filter(b=>b.checkIn===t).sort((a,b)=>(a.arrivalTime||"").localeCompare(b.arrivalTime||""));
  else if(f==="done") list = list.filter(policeReady).sort((a,b)=>b.checkIn.localeCompare(a.checkIn));
  else list = list.sort((a,b)=>b.checkIn.localeCompare(a.checkIn));
  const seg=[["todo","À remplir"+(todoAll.length?" ("+todoAll.length+")":"")],["today","Arrivées du jour"],["done","Remplies"],["all","Toutes"]];
  let h = '<div class="seg" role="tablist">'+seg.map(([k,l])=>'<button class="'+(k===f?'on':'')+'" data-act="pol-filter" data-f="'+k+'">'+l+'</button>').join("")+'</div>';
  h += '<input class="search" id="polQ" type="search" placeholder="Rechercher un nom, un n° de passeport…" value="'+esc(S.polQ||"")+'">';
  const rows = list.map(b=>{ const c=client(b.clientId), ok=policeReady(b), tr=b.travelers||[];
    const who = ok ? tr.map(x=>[x.prenom,(x.nom||"").toUpperCase()].filter(Boolean).join(" ")).join(", ") : esc(c?c.name:"");
    return '<div class="item"><span class="roomtag">'+esc(room(b.roomId)?.short||"?")+'</span><div class="grow"><div class="r1"><span class="t">'+esc(c?c.name:"Client")+'</span>'+(ok?'<span class="pill ok">✓ Remplie</span>':'<span class="pill bad">À remplir</span>')+'</div><div class="s">'+fmtD(b.policeIn||b.checkIn)+' → '+fmtD(b.policeOut||b.checkOut)+' · '+(b.adults!=null?b.adults:(b.guests||1))+' adulte(s)'+(ok?' · '+esc(who):'')+'</div></div><div class="ctrl"><button class="btn sm'+(ok?'':' primary')+'" data-act="pol-edit" data-id="'+b.id+'">'+(ok?'Modifier':'Remplir')+'</button>'+(ok?'<button class="btn sm" data-act="pol-print" data-id="'+b.id+'">Imprimer</button>':'')+'</div></div>'; }).join("");

function vFin(){
  const m = S.finMonth, [y,mo] = m.split("-").map(Number);
  const inM = d => d && d.slice(0,7)===m;
  const pays = [];
  S.bookings.forEach(b=>(b.payments||[]).forEach(p=>{ if(inM(p.date)) pays.push({...p, b}); }));
  pays.sort((a,b)=>b.date.localeCompare(a.date));
  const enc = pays.reduce((s,p)=>s+(Number(p.amount)||0),0);
  const exps = S.expenses.filter(e=>inM(e.date));
  const dep = exps.reduce((s,e)=>s+(Number(e.amount)||0),0);
  const first = m+"-01", last = addDays(toISO(new Date(y,mo,1)),-1), dim = Number(last.slice(8));
  let occN = 0; for(let i=0;i<dim;i++){ const d=addDays(first,i); occN += units().filter(r=>occupying(r.id,d)).length; }
  const rate = units().length ? Math.round(occN/(units().length*dim)*100) : 0;
  const byCat = {}; exps.forEach(e=>byCat[e.category||"Autre"]=(byCat[e.category||"Autre"]||0)+(Number(e.amount)||0));
  const prev = toISO(new Date(y,mo-2,1)).slice(0,7), next = toISO(new Date(y,mo,1)).slice(0,7);
  let h = '<div class="row spread"><h2>'+MOIS[mo-1].replace(/^./,c=>c.toUpperCase())+' '+y+'</h2><div class="row"><button class="btn sm" data-act="fin-month" data-m="'+prev+'" aria-label="Mois précédent">←</button><button class="btn sm" data-act="fin-month" data-m="'+today().slice(0,7)+'">Ce mois</button><button class="btn sm" data-act="fin-month" data-m="'+next+'" aria-label="Mois suivant">→</button></div></div>';
  h += '<div class="stats"><div class="stat" style="--sc:var(--k-arr)"><span>Encaissé</span><b class="num">'+dt(enc)+'</b></div><div class="stat" style="--sc:var(--k-due)"><span>Dépenses</span><b class="num">'+dt(dep)+'</b></div><div class="stat" style="--sc:var(--accent)"><span>Résultat</span><b class="num" style="color:'+(enc-dep>=0?'var(--ok)':'var(--bad)')+'">'+dt(enc-dep)+'</b></div><div class="stat" style="--sc:var(--k-out)"><span>Taux d\'occupation</span><b class="num">'+rate+' %</b></div></div>';
  const cats = Object.keys(byCat).length ? '<div class="catline">'+Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<span class="pill info num">'+esc(k)+' · '+dt(v)+'</span>').join("")+'</div>' : '';
  const expBody = exps.length ? exps.map(e=>'<div class="item click" data-act="edit-expense" data-id="'+e.id+'"><div class="grow"><div class="t">'+esc(e.label||e.category)+'</div><div class="s num">'+fmtD(e.date)+' · '+esc(e.category||"")+'</div></div><b class="num">'+dt(e.amount)+'</b></div>').join("") : '<div class="empty">Aucune dépense ce mois-ci.</div>';
  const payBody = pays.length ? pays.map(p=>{const c=client(p.b.clientId);return '<div class="item click" data-act="edit-booking" data-id="'+p.b.id+'"><div class="grow"><div class="t">'+esc(c?c.name:"")+'</div><div class="s num">'+fmtD(p.date)+' · '+esc(p.method||"")+'</div></div><b class="num">'+dt(p.amount)+'</b></div>';}).join("") : '<div class="empty">Aucun paiement enregistré ce mois-ci.</div>';
  const unpaid = activeBookings().filter(b=>balance(b)>0 && (inM(b.checkIn) || (b.checkIn<m+"-01" && b.checkOut>=m+"-01"))).sort((a,b)=>a.checkIn.localeCompare(b.checkIn));
  const unpaidSum = unpaid.reduce((t,b)=>t+balance(b),0);
  const dueBody = unpaid.length ? unpaid.map(b=>bookingItem(b)).join("") : '<div class="empty">Tout est encaissé pour ce mois.</div>';
  h += '<div class="cols3">'
     + sec("arr","card","Paiements reçus",pays.length,(pays.length?'<b class="num" style="color:var(--k-arr)">'+dt(enc)+'</b>':''), payBody)
     + sec("rem","coins","Reste à encaisser",unpaid.length,(unpaid.length?'<b class="num" style="color:var(--k-rem)">'+dt(unpaidSum)+'</b>':''), dueBody)
     + sec("due","coins","Dépenses",exps.length,(S.canWrite?'<button class="btn sm ghost" data-act="new-expense">+ Dépense</button>':''), expBody)
     + '</div>';
  const byMeth = {}; pays.forEach(p=>{ const k=p.method||"Autre"; byMeth[k]=(byMeth[k]||0)+(Number(p.amount)||0); });
  const methItems = Object.entries(byMeth).map(([k,v])=>({label:k,value:v})).sort((a,b)=>b.value-a.value);
  const catItems = Object.entries(byCat).map(([k,v])=>({label:k,value:v})).sort((a,b)=>b.value-a.value);
  const roomItems = S.rooms.map(r=>{ let v=0,n=0; activeBookings().filter(b=>b.roomId===r.id).forEach(b=>{ const k=nightsIn(b,first,addDays(last,1)); n+=k; v+=k*perNight(b); }); return {label:r.name,value:v,extra:n+" nuit"+(n>1?"s":"")}; }).filter(i=>i.value>0).sort((a,b)=>b.value-a.value);
  const box = (k,icon,t,items,col,emptyMsg) => '<section class="sec" style="--sc:var(--k-'+k+')"><div class="sh"><svg viewBox="0 0 24 24" aria-hidden="true">'+SEC_ICONS[icon]+'</svg><h3>'+t+'</h3></div><div style="padding:12px 14px">'+(items.length?chartH(items, v=>dt(Math.round(v)), col, t):'<div class="s" style="color:var(--muted);font-size:.86rem">'+emptyMsg+'</div>')+'</div></section>';
  h += '<div class="cols3">'
     + box("arr","card","Encaissé par mode de paiement",methItems,"var(--k-arr)","Aucun paiement ce mois-ci.")
     + box("clean","clean","Chiffre d\'affaires par chambre",roomItems,"var(--c1)","Aucune nuit vendue ce mois-ci.")
     + box("due","coins","Dépenses par catégorie",catItems,"var(--k-due)","Aucune dépense ce mois-ci.")
     + '</div>';
  return h;
}

// ---------- analyse ----------
function monthStart(ym){ return ym+"-01"; }
function nextMonth(ym){ const [y,m]=ym.split("-").map(Number); return toISO(new Date(y,m,1)).slice(0,7); }
function addMonths(ym,n){ const [y,m]=ym.split("-").map(Number); return toISO(new Date(y,m-1+n,1)).slice(0,7); }
function nightsIn(b, from, to){ const a = b.checkIn>from?b.checkIn:from, z = b.checkOut<to?b.checkOut:to; return z>a ? nights(a,z) : 0; }
function perNight(b){ const n = nights(b.checkIn,b.checkOut); return n ? (Number(b.total)||0)/n : 0; }
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))), f=v/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
const dtShort = n => n>=10000 ? (Math.round(n/100)/10).toLocaleString("fr-FR")+" k" : Math.round(n).toLocaleString("fr-FR");

function stats(from, to){
  const act = activeBookings();
  let ca=0, nts=0;
  act.forEach(b=>{ const k=nightsIn(b,from,to); if(k){ nts+=k*weight(b); ca+=k*perNight(b); } });
  const days = nights(from,to), cap = units().length*days;
  const started = act.filter(b=>b.checkIn>=from && b.checkIn<to);
  const cancelled = S.bookings.filter(b=>b.status==="annulee" && b.checkIn>=from && b.checkIn<to).length;
  let enc=0; S.bookings.forEach(b=>(b.payments||[]).forEach(p=>{ if(p.date>=from && p.date<to) enc+=Number(p.amount)||0; }));
  const dep = S.expenses.filter(e=>e.date>=from && e.date<to).reduce((s,e)=>s+(Number(e.amount)||0),0);
  const reste = started.reduce((s,b)=>s+balance(b),0);
  return { ca, nts, occ: cap? nts/cap : 0, adr: nts? ca/nts : 0, resas: started.length,
    avgLen: started.length ? started.reduce((s,b)=>s+nights(b.checkIn,b.checkOut),0)/started.length : 0,
    cancelled, enc, dep, reste, started };
}

function chartBars(months, series, fmt, opts){
  const mainW=(document.getElementById("main")||{}).clientWidth||640, W=Math.max(300,Math.min(640,mainW-34)), H=Math.round(W<480?200:230), L=W<480?40:48, R=8, T=14, B=34, iw=W-L-R, ih=H-T-B;
  const max = niceMax(Math.max(0,...series.flatMap(s=>s.values)) * (opts&&opts.pct?1:1.08));
  const top = opts&&opts.pct ? Math.max(max, 0.0001) : max;
  const gw = iw/months.length, n=series.length, gap=2, bw=Math.min(28,(gw*0.72-gap*(n-1))/n);
  let g = '';
  for(let i=0;i<=4;i++){ const v=top*i/4, y=T+ih-ih*i/4;
    g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" class="gl"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" class="tk">'+fmt(v)+'</text>'; }
  months.forEach((m,i)=>{
    const cx = L+gw*i+gw/2, x0 = cx-(n*bw+(n-1)*gap)/2;
    series.forEach((s,j)=>{ const v=s.values[i], h=v>0?Math.max(2,ih*v/top):0, x=x0+j*(bw+gap), y=T+ih-h;
      if(h>0){ const r=Math.min(4,bw/2,h);
        g += '<path d="M'+x+','+(T+ih)+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+bw-r)+'Q'+(x+bw)+','+y+' '+(x+bw)+','+(y+r)+'V'+(T+ih)+'Z" style="fill:'+s.color+'"/>'; }
      g += '<rect x="'+(x-gap/2)+'" y="'+T+'" width="'+(bw+gap)+'" height="'+ih+'" class="hit" data-tip="'+esc(m.full+' · '+s.name+' : '+(opts&&opts.tipFmt?opts.tipFmt(v):fmt(v)))+'"/>';
    });
    g += '<text x="'+cx+'" y="'+(H-B+18)+'" text-anchor="middle" class="tk'+(m.cur?' cur':'')+'">'+esc(m.lab)+'</text>';
  });
  g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(T+ih)+'" y2="'+(T+ih)+'" class="ax"/>';
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts&&opts.label||"")+'">'+g+'</svg></div>';
}

function chartH(items, fmt, color, label){
  if(!items.length) return '<div class="empty">Pas encore de données sur cette période.</div>';
  const max = Math.max(...items.map(i=>i.value)) || 1;
  return '<div class="hbars" role="list" aria-label="'+esc(label)+'">'+items.map(i=>
    '<div class="hb" role="listitem" data-tip="'+esc(i.label+' : '+fmt(i.value)+(i.extra?' · '+i.extra:''))+'"><span class="hl">'+esc(i.label)+'</span><span class="ht"><span class="hf" style="width:'+Math.max(2,i.value/max*100)+'%;background:'+color+'"></span></span><span class="hv num">'+fmt(i.value)+'</span></div>').join("")+'</div>';
}

// ---------- rappels & calendrier ----------
const arrivalAt = b => new Date(b.checkIn+"T"+(b.arrivalTime||"14:00")+":00");
function upcomingArrivals(hours){ const now=Date.now(), lim=now+hours*3600e3; return activeBookings().filter(b=>{ const t=arrivalAt(b).getTime(); return t>now && t<=lim; }).sort((a,b)=>arrivalAt(a)-arrivalAt(b)); }
function inHours(b){ const m=Math.max(0,Math.round((arrivalAt(b)-Date.now())/60000)); return m<60 ? "dans "+m+" min" : "dans "+Math.floor(m/60)+" h"+(m%60>=5?" "+String(m%60).padStart(2,"0"):""); }
const icsEsc = v => String(v||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
function icsFor(list){
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
  const ev = list.map(b=>{ const c=client(b.clientId), r=room(b.roomId), d=b.checkIn.replace(/-/g,""), t=(b.arrivalTime||"14:00").replace(":","")+"00";
    const desc = [(b.guests||1)+" personne(s)", "Séjour du "+fmtD(b.checkIn)+" au "+fmtD(b.checkOut), c&&c.phone?"Tél : "+c.phone:"", balance(b)>0?"Reste à encaisser : "+dt(balance(b)):"Payé", b.notes||""].filter(Boolean).join("\n");
    return ["BEGIN:VEVENT","UID:"+b.id+"@darsalma","DTSTAMP:"+stamp,"DTSTART:"+d+"T"+t,"DURATION:PT1H",
      "SUMMARY:"+icsEsc("Arrivée Dar Salma : "+(c?c.name:"client")+" · "+(r?r.name:"")),"DESCRIPTION:"+icsEsc(desc),
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc("Arrivée demain : "+(c?c.name:"")),"TRIGGER:-PT24H","END:VALARM",
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc("Arrivée dans 12 h : "+(c?c.name:"")),"TRIGGER:-PT12H","END:VALARM","END:VEVENT"].join("\r\n"); });
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Dar Salma//Gestion//FR","CALSCALE:GREGORIAN","METHOD:PUBLISH"].concat(ev,["END:VCALENDAR"]).join("\r\n");
}
function googleCalUrl(b){
  const c=client(b.clientId), r=room(b.roomId), d=b.checkIn.replace(/-/g,""), t=(b.arrivalTime||"14:00").replace(":","")+"00";
  const [hh,mm]=(b.arrivalTime||"14:00").split(":").map(Number), end=String(Math.min(23,hh+1)).padStart(2,"0")+String(mm).padStart(2,"0")+"00";
  const details=[(b.guests||1)+" personne(s)", "Séjour du "+fmtD(b.checkIn)+" au "+fmtD(b.checkOut), c&&c.phone?"Tél : "+c.phone:"", balance(b)>0?"Reste à encaisser : "+dt(balance(b)):"Payé", b.notes||""].filter(Boolean).join("\n")+"\n\nRappels conseillés : 1 jour et 12 heures avant";
  const q=new URLSearchParams({action:"TEMPLATE", text:"Arrivée Dar Salma : "+(c?c.name:"client")+" · "+(r?r.name:""), dates:d+"T"+t+"/"+d+"T"+end, details, ctz:"Africa/Tunis"});
  if(S.settings&&S.settings.address) q.set("location", S.settings.address);
  return "https://calendar.google.com/calendar/render?"+q.toString();
}
function downloadIcs(list, name){
  if(!list.length){ toast("Aucune arrivée à venir"); return; }
  const blob = new Blob([icsFor(list)], {type:"text/calendar;charset=utf-8"}), url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
  toast("Ouvrez le fichier pour l'ajouter au calendrier");
}

const TF = [
  ["nom","Nom","text"],["prenom","Prénom","text"],["naissance","Date de naissance","date"],["lieuNaissance","Lieu de naissance","text"],
  ["nationalite","Nationalité","text"],
  ["pieceType","Pièce","select"],["pieceNum","N° de la pièce","text"],["pieceDate","Délivrée le","date"],["pieceLieu","Délivrée à","text"]

function splitName(n){ const p=String(n||"").trim().split(/\s+/); if(p.length<2) return {prenom:p[0]||"", nom:""}; return {prenom:p.slice(0,-1).join(" "), nom:p[p.length-1]}; }
function travelersOf(b){
  const c = client(b.clientId)||{};
  let list = Array.isArray(b.travelers) && b.travelers.length ? JSON.parse(JSON.stringify(b.travelers)) : [];
  if(!list.length){ const sn=splitName(c.name); list=[{nom:sn.nom, prenom:sn.prenom, nationalite:c.nationality||"", pieceType:"Passeport", pieceNum:c.idDoc||"", adresse:"", profession:"", naissance:"", lieuNaissance:"", pieceDate:"", pieceLieu:""}]; }
  const ad = Math.max(1, b.adults!=null ? b.adults : (b.guests||1)-(b.children||0));
  while(list.length < ad) list.push({nom:"",prenom:"",pieceType:"Passeport"});
  return list;
}

    + row("Date d'arrivée",fdate(b.policeIn||b.checkIn))+row("Date de départ",fdate(b.policeOut||b.checkOut))
    + row("Chambre",r?r.name:"")+row("Venant de",b.provenance)+row("Se rendant à",b.destination)

async function printFiches(bookings){

  for(const b of bookings){
    const list = travelersOf(b);

}

async function compressImage(file){
  const url = URL.createObjectURL(file);
  try{
    const img = new Image(); await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=url; });
    const max=1400, k=Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    let q=0.72, d=c.toDataURL("image/jpeg",q); while(d.length>650000 && q>0.35){ q-=0.08; d=c.toDataURL("image/jpeg",q); }
    return d;
  } finally { URL.revokeObjectURL(url); }
}
async function loadPieces(field, value){
  if(!S.db) return [];

    return snap.docs.map(d=>({id:d.id, ...d.data(), saved:true})).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt))); }

      g("b_ex").addEventListener("click",e=>{ const i=e.target.dataset.rmex; if(i!=null){ b.extras.splice(Number(i),1); sync(); } });
    }
    g("p_add").addEventListener("click",()=>{ const a=Number(g("p_amt").value); if(!(a>0)){ g("p_amt").focus(); return; } b.payments=(b.payments||[]).concat([{amount:a,method:g("p_meth").value,date:g("p_date").value||today()}]); g("p_amt").value=""; sync(); });
    g("b_pays").addEventListener("click",e=>{ const i=e.target.dataset.rmpay; if(i!=null){ b.payments.splice(Number(i),1); sync(); } });
    if(g("b_cancel")) g("b_cancel").addEventListener("click", async()=>{ b.status="annulee"; if(await save("bookings",b.id,strip(b))){ closeSheet(); toast("Réservation annulée"); } });
    if(g("b_restore")) g("b_restore").addEventListener("click", async()=>{ const cl=conflicts(b.roomId,b.checkIn,b.checkOut,b.id); if(cl.length){ g("b_err").innerHTML='<div class="note bad">Impossible de rétablir : la chambre est prise entre-temps du '+fmtD(cl[0].checkIn)+' au '+fmtD(cl[0].checkOut)+'.</div>'; return; } b.status="confirmee"; if(await save("bookings",b.id,strip(b))){ closeSheet(); toast("Réservation rétablie"); } });
    let pics = [];
    const drawPics = () => {
      const vis = pics.filter(p=>!p.del);
      g("b_pics").innerHTML = vis.length ? vis.map((p,i)=>'<div class="pic" data-view="'+pics.indexOf(p)+'" role="button" tabindex="0" aria-label="Voir la photo"><img src="'+p.data+'" alt="">'+(p.saved?'':'<span class="nw">À enregistrer</span>')+(S.canWrite?'<button type="button" class="x" data-rm="'+pics.indexOf(p)+'" aria-label="Retirer la photo">×</button>':'')+'</div>').join("") : '<span class="s" style="color:var(--muted);font-size:.85rem">Aucune photo pour l\'instant.</span>';
    };
    if(isNew) drawPics(); else loadPieces("bookingId", b.id).then(list=>{ pics = list.concat(pics); if(g("b_pics")) drawPics(); });
    g("b_pics").addEventListener("click", e=>{
      const rm=e.target.closest("[data-rm]"); if(rm){ e.stopPropagation(); const p=pics[Number(rm.dataset.rm)]; if(p.saved) p.del=true; else pics.splice(Number(rm.dataset.rm),1); drawPics(); return; }
      const v=e.target.closest("[data-view]"); if(v) viewPhoto(pics[Number(v.dataset.view)].data);
    });
    const addFiles = async files => { for(const f of files){ try{ const d=await compressImage(f); pics.push({id:uid(), data:d, saved:false}); drawPics(); }catch(x){ toast("Photo illisible, réessayez"); } } };
    if(g("b_cam")) g("b_cam").addEventListener("change", e=>{ addFiles([...e.target.files]); e.target.value=""; });
    if(g("b_file")) g("b_file").addEventListener("change", e=>{ addFiles([...e.target.files]); e.target.value=""; });
    const savePics = async (cid) => {
      let ok=true;
      for(const p of pics){
        try{
          if(p.del && p.saved){ await S.db.collection("pieces").doc(p.id).delete(); }
          else if(!p.saved){ await S.db.collection("pieces").doc(p.id).set({bookingId:b.id, clientId:cid, data:p.data, createdAt:new Date().toISOString()}); p.saved=true; }
          else if(p.clientId!==cid){ await S.db.collection("pieces").doc(p.id).update({clientId:cid}); }
        }catch(x){ ok=false; }
      }
      if(!ok) toast("Une photo n'a pas pu être enregistrée");
    };
    if(g("b_del")) armDelete(g("b_del"), async()=>{ if(await remove("bookings",b.id)){ for(const p of pics.filter(p=>p.saved)) await remove("pieces",p.id); closeSheet(); toast("Réservation supprimée"); } });
    g("bf").addEventListener("submit", async e=>{
      e.preventDefault();
      const err = m => g("b_err").innerHTML='<div class="note bad">'+m+'</div>';
      let cid = g("b_client").value;
      if(cid==="__new"){
        const name = g("nc_name").value.trim(); if(!name) return err("Indiquez le nom du client.");
        cid = uid(); if(!await save("clients",cid,{name, phone:getPhone(g,"nc_phone"), nationality:"", idDoc:"", notes:""})) return;
      }
      if(!cid) return err("Choisissez un client.");
      if(!g("b_room").value) return err("Ajoutez d'abord une chambre.");
      if(nights(g("b_in").value,g("b_out").value)<1) return err("Le départ doit être après l'arrivée.");
      { const ci=g("b_in").value, co=g("b_out").value, rid=g("b_room").value;
        const clash = conflicts(rid,ci,co,b.id);
        if(clash.length && b.status!=="annulee"){ const x=clash[0]; return err((isHouse(rid)?"La maison entière n'est pas libre : "+esc(room(x.roomId)?.name||"une chambre"):esc(room(x.roomId)?.name||"Cette chambre"))+" est déjà réservée du "+fmtD(x.checkIn)+" au "+fmtD(x.checkOut)+" ("+esc(client(x.clientId)?.name||"")+"). Choisissez une autre chambre ou d'autres dates."); } }
      Object.assign(b,{clientId:cid, roomId:g("b_room").value, adults:Math.max(1,Number(g("b_guests").value)||1), children:Math.max(0,Number(g("b_kids").value)||0), guests:Math.max(1,Number(g("b_guests").value)||1)+Math.max(0,Number(g("b_kids").value)||0), babyBed:g("b_baby").checked, arrivalTime:g("b_time").value||"14:00", checkIn:g("b_in").value, checkOut:g("b_out").value, pricePerNight:Number(g("b_price").value)||0, source:g("b_source").value, notes:g("b_notes").value.trim()});
      b.priceMode = mode; b.total = nights(b.checkIn,b.checkOut)*b.pricePerNight*(mode==="personne"?b.adults+b.children*0.5:1) + extrasSum(b); delete b.example;
      if(b.status==="option") b.status="confirmee"; const autoConf=false;
      if(await save("bookings",b.id,strip(b))){ const n=pics.filter(p=>!p.saved||p.del).length; if(n) toast("Enregistrement des photos…"); await savePics(cid); closeSheet(); toast(autoConf?"Acompte reçu : réservation confirmée":"Réservation enregistrée"); }
    });
    sync();
  });
}

function resetSheet(){

  openSheet('<form class="f" id="zf"><div class="row spread"><h2>Remettre à zéro</h2><button type="button" class="btn ghost" data-act="close">Fermer</button></div>'

    + '<div class="summary"><div><span>Réservations</span><span class="num">'+n.b+'</span></div><div><span>Clients</span><span class="num">'+n.c+'</span></div><div><span>Dépenses</span><span class="num">'+n.e+'</span></div><div><span>Photos de pièces d\'identité</span><span class="num">toutes</span></div></div>'
    + '<label style="display:flex;gap:8px;align-items:center;color:var(--fg)"><input type="checkbox" id="z_rooms" style="width:auto"> Remettre aussi les chambres et les paramètres d\'origine</label>'
    + '<p style="margin:0;color:var(--muted);font-size:.88rem">Sans cette case, les chambres (noms, prix) et les paramètres de la maison sont conservés.</p>'
    + '<label>Pour confirmer, tapez EFFACER<input id="z_conf" autocomplete="off" autocapitalize="characters"></label>'
    + '<div id="z_err"></div><div class="row spread"><span></span><button class="btn danger armed" type="submit" id="z_go">Tout effacer</button></div></form>', sh=>{
    const g=id=>$("#"+id,sh);
    g("zf").addEventListener("submit", async e=>{ e.preventDefault();
      if(g("z_conf").value.trim().toUpperCase()!=="EFFACER"){ g("z_err").innerHTML='<div class="note bad">Tapez EFFACER pour confirmer.</div>'; g("z_conf").focus(); return; }
      g("z_go").disabled=true; g("z_go").textContent="Effacement…";
      const withRooms=g("z_rooms").checked; const cols=["bookings","clients","expenses","pieces"]; if(withRooms) cols.push("rooms","settings");
      let fail=0, done=0;
      for(const col of cols){ try{ const snap=await S.db.collection(col).get(); for(const d of snap.docs){ try{ await d.ref.delete(); done++; }catch(x){ fail++; } } }catch(x){ fail++; } }
      if(withRooms){ S.seeded=false; S.houseSeeded=false; S.priceMigrated=false; }

    });
  });
}

    g("rf").addEventListener("submit", async e=>{ e.preventDefault(); const name=g("r_name").value.trim(); if(!name){ g("r_err").innerHTML='<div class="note bad">Donnez un nom à la chambre.</div>'; return; }
      Object.assign(r,{name, short:g("r_short").value.trim()||name.slice(0,3), price:Number(g("r_price").value)||0, capacity:Number(g("r_cap").value)||1, priceMode: g("r_mode") ? g("r_mode").value : "nuit", beds:g("r_beds").value, babyBed:g("r_baby").checked, status:g("r_status").value, note:g("r_note").value.trim()}); if(r.status==="propre" && roomState(room(r.id)||r)!=="propre") r.cleanedAt=new Date().toISOString(); delete r.example;
      if(await save("rooms",r.id,strip(r))){ closeSheet(); toast("Chambre enregistrée"); } });
  });
}

function armDelete(btn, fn){
  btn.addEventListener("click", ()=>{
    if(btn.classList.contains("armed")){ fn(); return; }
    btn.classList.add("armed"); btn.textContent="Confirmer la suppression";
    setTimeout(()=>{ if(btn.isConnected){ btn.classList.remove("armed"); btn.textContent="Supprimer"; } }, 4000);
  });
}

// ---------- events ----------
$("#tabs").addEventListener("click", e=>{ const b=e.target.closest("button[data-tab]"); if(!b) return; S.tab=b.dataset.tab; store.set("ds_tab",S.tab); render(); window.scrollTo(0,0); });
let clearArmed = false;
document.addEventListener("click", async e=>{
  const el = e.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if(a==="close-bg"){ if(e.target===el) closeSheet(); return; }
  if(a==="close") return closeSheet();
  if(a==="new-booking"){ if(!S.canWrite) return; bookingSheet(null); if(el.dataset.room){ const sh=$("#sheetRoot .sheet"); $("#b_room",sh).value=el.dataset.room; $("#b_in",sh).value=el.dataset.day; $("#b_out",sh).value=addDays(el.dataset.day,1); $("#b_room",sh).dispatchEvent(new Event("change")); $("#b_in",sh).dispatchEvent(new Event("input")); $("#b_price",sh).dispatchEvent(new Event("input")); } return; }
  if(a==="edit-booking"){ const b=S.bookings.find(x=>x.id===id); if(b) bookingSheet(b); return; }
  if(a==="new-client") return clientSheet(null);
  if(a==="edit-client"){ const c=client(id); if(c) clientSheet(c); return; }
  if(a==="new-expense") return expenseSheet(null);
  if(a==="edit-expense"){ const x=S.expenses.find(y=>y.id===id); if(x) expenseSheet(x); return; }
  if(a==="new-room") return roomSheet(null);
  if(a==="edit-room"){ const r=room(id); if(r) roomSheet(r); return; }
  if(a==="rooms-sheet") return roomsSheet();
  if(a==="print-police-day"){ const t=today(); return printFiches(activeBookings().filter(b=>b.checkIn===t)); }
  if(a==="goto-police"){ S.tab="clients"; S.clientSub="police"; S.polFilter="today"; store.set("ds_tab","clients"); render(); window.scrollTo(0,0); return; }
  if(a==="client-sub"){ S.clientSub=el.dataset.s; return render(); }
  if(a==="pol-filter"){ S.polFilter=el.dataset.f; return render(); }
  if(a==="pol-edit"){ const b=S.bookings.find(x=>x.id===id); if(b) policeSheet(b); return; }
  if(a==="pol-print"){ const b=S.bookings.find(x=>x.id===id); if(b) printFiches([b]); return; }
  if(a==="pol-print-list"){ const t=today(), f=S.polFilter||"todo"; let l=activeBookings().filter(policeReady); if(f==="today") l=l.filter(b=>b.checkIn===t); return printFiches(l.sort((x,y)=>x.checkIn.localeCompare(y.checkIn))); }
  if(a==="goto-set"){ S.tab="set"; store.set("ds_tab","set"); render(); window.scrollTo(0,0); return; }
  if(a==="logout-btn"){ $("#logout").click(); return; }
  if(a==="arrive"||a==="depart"){ const b=S.bookings.find(x=>x.id===id); if(!b) return; el.disabled=true; const now=new Date().toISOString();
    if(await markStay(id, a==="arrive"?"arrivedAt":"departedAt", now)){ const c=client(b.clientId), bal=balance(b);
      toast(a==="arrive" ? "Arrivée de "+(c?firstName(c.name):"client")+" enregistrée"+(bal>0?" · reste "+dt(bal)+" à encaisser":"") : "Départ de "+(c?firstName(c.name):"client")+" enregistré · chambre à nettoyer"+(bal>0?" · reste "+dt(bal):"")); } else el.disabled=false; return; }
  if(a==="settings") return settingsSheet();
  if(a==="reset") return resetSheet();
  if(a==="ics-all") return downloadIcs(upcomingArrivals(24), "arrivees-24h.ics");
  if(a==="ics-upcoming"){ const t=today(); return downloadIcs(activeBookings().filter(b=>b.checkIn>=t).sort((x,y)=>x.checkIn.localeCompare(y.checkIn)), "arrivees-a-venir.ics"); }
  if(a==="cycle-status"){ const r=room(id); if(!r) return; const cur=roomState(r); if(cur==="occupee") return; const nx = cur==="propre" ? "a_nettoyer" : "propre";
    const data={...strip(r), status:nx}; if(nx==="propre") data.cleanedAt=new Date().toISOString(); if(await save("rooms",r.id,data)) toast(nx==="propre"?r.name+" est propre":r.name+" à nettoyer"); return; }
  if(a==="cal-prev"){ S.calStart=addDays(S.calStart,-7); return render(); }
  if(a==="cal-next"){ S.calStart=addDays(S.calStart,7); return render(); }
  if(a==="cal-today"){ S.calStart=addDays(today(),-1); return render(); }
  if(a==="resa-filter"){ S.resaFilter=el.dataset.f; return render(); }
  if(a==="fin-month"){ S.finMonth=el.dataset.m; return render(); }
  if(a==="ana-period"){ S.anaPeriod=el.dataset.p; return render(); }
  if(a==="clear-ex"){
    if(!clearArmed){ clearArmed=true; el.textContent="Confirmer : tout supprimer"; el.classList.add("danger","armed"); setTimeout(()=>{clearArmed=false; render();},4000); return; }
    clearArmed=false; el.disabled=true;
    for(const col of ["bookings","clients","expenses"]) for(const x of S[col].filter(y=>y.example)) await remove(col,x.id);
    for(const r of S.rooms.filter(y=>y.example)) await save("rooms",r.id,(({example,...rest})=>strip(rest))(r));
    toast("Exemples supprimés"); return;
  }
});
document.addEventListener("input", e=>{ const id=e.target.id; if(id==="clientQ"||id==="resaQ"||id==="polQ"){ if(id==="clientQ") S.clientQ=e.target.value; else if(id==="polQ") S.polQ=e.target.value; else S.resaQ=e.target.value; const pos=e.target.selectionStart; render(); const i=$("#"+id); if(i){ i.focus(); try{i.setSelectionRange(pos,pos)}catch(_){} } } });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && sheetOpen) closeSheet(); });

// tooltip
const tipEl = document.createElement("div"); tipEl.className="tip"; tipEl.hidden=true; document.body.appendChild(tipEl);
document.addEventListener("pointerover", e=>{ const el=e.target.closest("[data-tip]"); if(!el){ tipEl.hidden=true; return; } tipEl.textContent=el.dataset.tip; tipEl.hidden=false; });
document.addEventListener("pointermove", e=>{ if(tipEl.hidden) return; const w=tipEl.offsetWidth, x=Math.min(window.innerWidth-w-8, Math.max(8,e.clientX-w/2)); tipEl.style.left=x+"px"; tipEl.style.top=Math.max(8,e.clientY-44)+"px"; });
document.addEventListener("pointerdown", e=>{ if(!e.target.closest("[data-tip]")) tipEl.hidden=true; else { const el=e.target.closest("[data-tip]"); tipEl.textContent=el.dataset.tip; tipEl.hidden=false; const w=tipEl.offsetWidth; tipEl.style.left=Math.min(window.innerWidth-w-8,Math.max(8,e.clientX-w/2))+"px"; tipEl.style.top=Math.max(8,e.clientY-50)+"px"; } });
window.addEventListener("scroll", ()=>{ tipEl.hidden=true; }, {passive:true});
setInterval(()=>{ if(!sheetOpen && S.db && (S.tab==="jour")) render(); }, 60000);
let rz; window.addEventListener("resize", ()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if((S.tab==="ana"||S.tab==="cal") && !sheetOpen) render(); },200); });
boot();
})();
</script>
</body>
</html>
